<header>Technician Class License Course (2022–2026)</header>

<header>Technician Class License Course (2022–2026)</header>
<h2 id="introduction"><strong>Introduction</strong></h2>
<h3 id="what-is-amateur-radio">What is Amateur Radio?</h3>
<ul>
<li data-marpit-fragment="1">Also known as <strong>&quot;Ham Radio&quot;</strong></li>
<li data-marpit-fragment="2">A service and hobby for non-commercial communication</li>
<li data-marpit-fragment="3"><strong>Key Pillars:</strong>
<ul>
<li data-marpit-fragment="4"><strong>Public Service:</strong> Emergency comms when other systems fail</li>
<li data-marpit-fragment="5"><strong>Technical Skill:</strong> Experimentation with electronics and radio</li>
<li data-marpit-fragment="6"><strong>International Goodwill:</strong> Connecting with people globally</li>
</ul>
</li>
</ul>
<footer>Based on <a href="https://hambook.org/tech2022/">https://hambook.org/tech2022/</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-fragments="8" data-class="lead" data-background-color="#fff" data-paginate="true" data-header="Technician Class License Course (2022–2026)" data-footer="Based on https://hambook.org/tech2022/" data-theme="gaia" lang="C" class="lead" data-marpit-pagination="4" style="--class:lead;--background-color:#fff;--paginate:true;--header:Technician Class License Course (2022–2026);--footer:Based on https://hambook.org/tech2022/;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="11">
<header>Technician Class License Course (2022–2026)</header>
<h2 id="the-technician-license"><strong>The Technician License</strong></h2>
<h3 id="your-first-step">Your First Step</h3>
<ul>
<li data-marpit-fragment="1">The entry-level license in the United States</li>
<li data-marpit-fragment="2"><strong>Privileges:</strong>
<ul>
<li data-marpit-fragment="3">Full privileges on <strong>VHF/UHF</strong> (local &amp; regional comms)</li>
<li data-marpit-fragment="4">Limited privileges on <strong>HF</strong> (long-distance &quot;skip&quot; comms)</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>The Exam:</strong>
<ul>
<li data-marpit-fragment="6"><strong>35</strong> multiple-choice questions</li>
<li data-marpit-fragment="7"><strong>Passing score:</strong> 26 (74%)</li>
<li data-marpit-fragment="8"><strong>No Morse code required!</strong></li>
</ul>
</li>
</ul>
<footer>Based on <a href="https://hambook.org/tech2022/">https://hambook.org/tech2022/</a></footer>
</section>

<header>Technician Class License Course (2022–2026)</header>
<h2 id="section-11-electrical-basics"><strong>Section 1.1: Electrical Basics</strong></h2>
<h3 id="the-water-analogy">The Water Analogy</h3>
<ul>
<li data-marpit-fragment="1">Electricity behaves like water flowing through a pipe</li>
<li data-marpit-fragment="2"><strong>Voltage (E):</strong> The pressure pushing the water (<em>Potential</em>)</li>
<li data-marpit-fragment="3"><strong>Current (I):</strong> The volume of water flowing (<em>Flow</em>)</li>
<li data-marpit-fragment="4"><strong>Resistance (R):</strong> The restriction in the pipe (<em>Opposition</em>)</li>
</ul>
<footer>Based on <a href="https://hambook.org/tech2022/">https://hambook.org/tech2022/</a></footer>
</section>
